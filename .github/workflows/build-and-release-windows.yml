name: Build & Release Windows .EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop App (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build packages and Web UI
        run: pnpm run build

      - name: Configure desktop environment (.env.windows)
        shell: pwsh
        run: |
          @"
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=https://download.deepseek.com
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://harness-test.deepseek.com
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://harness.deepseek.com
          "@ | Set-Content -Path "apps/desktop/.env.windows" -Encoding utf8

      - name: Package Windows Desktop App (.exe)
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Find and compress installer with maximum compression
        id: find_exe
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "apps/desktop/.desktop-build" -Recurse -Filter "*deepseek-harness*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            $installer = Get-ChildItem -Path apps/desktop -Recurse -Filter "*.exe" | Sort-Object Length -Descending | Select-Object -First 1
          }
          if (-not $installer) {
            Write-Error "No .exe installer found!"
            exit 1
          }
          $sizeMB = [math]::Round($installer.Length / 1MB, 2)
          Write-Host "Installer: $($installer.FullName) (${sizeMB} MB)"

          # Compress with 7-Zip LZMA2 ultra settings for maximum compression
          $sevenZipPath = "$($installer.DirectoryName)/DeepSeek-Harness-Windows-Compressed.7z"
          Write-Host "Compressing with 7-Zip LZMA2 ultra (solid archive, 256MB dictionary)..."
          & 7z a -t7z -m0=lzma2 -mx=9 -mfb=273 -md=256m -ms=on "$sevenZipPath" "$($installer.FullName)"

          $sevenZipSizeMB = [math]::Round((Get-Item $sevenZipPath).Length / 1MB, 2)
          Write-Host "7z archive size: ${sevenZipSizeMB} MB (saved $([math]::Round($sizeMB - $sevenZipSizeMB, 2)) MB)"

          # Also create a ZIP for users who prefer it (still with max compression)
          $zipPath = "$($installer.DirectoryName)/DeepSeek-Harness-Windows-Compressed.zip"
          Write-Host "Creating ZIP fallback with maximum deflate compression..."
          & 7z a -tzip -mx=9 -mfb=258 -mpass=15 "$zipPath" "$($installer.FullName)"

          $zipSizeMB = [math]::Round((Get-Item $zipPath).Length / 1MB, 2)
          Write-Host "ZIP size: ${zipSizeMB} MB"

          echo "INSTALLER_PATH=$($installer.FullName)" >> $env:GITHUB_ENV
          echo "ZIP_PATH=$zipPath" >> $env:GITHUB_ENV
          echo "SEVEN_ZIP_PATH=$sevenZipPath" >> $env:GITHUB_ENV

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.6-alpha.2' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'DeepSeek Harness v0.1.6-alpha.2 (Windows)' }}
          body: |
            ## DeepSeek Harness Windows Desktop Release 🚀
            
            نسخة تطبيق سطح المكتب لنظام ويندوز مضغوطة بأقصى درجات الضغط.
            
            ### خيارات التحميل (Downloads):
            - **`.exe`** — ملف التثبيت المباشر: حمّله وشغّله مباشرة.
            - **`-Compressed.7z`** — 🏆 أقصى ضغط (LZMA2): أصغر حجم ممكن. يحتاج [7-Zip](https://7-zip.org) لفك الضغط.
            - **`-Compressed.zip`** — نسخة مضغوطة متوافقة: فك الضغط ثم شغّل ملف الـ `.exe`.
          files: |
            ${{ env.INSTALLER_PATH }}
            ${{ env.SEVEN_ZIP_PATH }}
            ${{ env.ZIP_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

