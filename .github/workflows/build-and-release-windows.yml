name: Build & Release Windows .EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop App (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build packages and Web UI
        run: pnpm run build

      - name: Configure desktop environment (.env.windows)
        shell: pwsh
        run: |
          @"
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=https://download.deepseek.com
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://harness-test.deepseek.com
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://harness.deepseek.com
          "@ | Set-Content -Path "apps/desktop/.env.windows" -Encoding utf8

      - name: Package Windows Desktop App (.exe)
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Find and compress installer
        id: find_exe
        shell: pwsh
        run: |
          $exeFiles = Get-ChildItem -Path apps/desktop -Recurse -Filter "*.exe" | Select-Object -ExpandProperty FullName
          Write-Host "Found EXE files:"
          $exeFiles | ForEach-Object { Write-Host $_ }
          if (-not $exeFiles) {
            Write-Error "No .exe installer found!"
            exit 1
          }
          $installer = Get-ChildItem -Path "apps/desktop/.desktop-build", "apps/desktop/dist" -Recurse -Filter "*deepseek-harness*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            $installer = Get-ChildItem -Path apps/desktop -Recurse -Filter "*.exe" | Sort-Object Length -Descending | Select-Object -First 1
          }
          Write-Host "Selected installer: $($installer.FullName)"
          
          # Compress to zip with 7-Zip ultra compression
          $zipPath = "$($installer.DirectoryName)/$($installer.BaseName)-compressed.zip"
          Write-Host "Compressing to: $zipPath"
          & 7z a -tzip -mx=9 "$zipPath" "$($installer.FullName)"

          echo "INSTALLER_PATH=$($installer.FullName)" >> $env:GITHUB_ENV
          echo "ZIP_PATH=$zipPath" >> $env:GITHUB_ENV

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.6-alpha.2' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'DeepSeek Harness v0.1.6-alpha.2 (Windows)' }}
          body: |
            ## DeepSeek Harness Windows Desktop Release 🚀
            
            نسخة تطبيق سطح المكتب لنظام ويندوز جاهزة للتحميل والتثبيت المباشر بأعلى درجات الضغط.
            
            ### خيارات التحميل (Downloads):
            - **ملف التثبيت المباشر (`.exe`)**: جاهز للتشغيل والتثبيت فوراً.
            - **الملف المضغوط (`-compressed.zip`)**: نسخة مضغوطة بحجم أقل لتسريع التنزيل.
          files: |
            ${{ env.INSTALLER_PATH }}
            ${{ env.ZIP_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
