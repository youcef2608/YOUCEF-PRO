name: Build & Release Windows .EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Desktop App (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build packages and Web UI
        run: pnpm run build

      - name: Configure desktop environment (.env.windows)
        shell: pwsh
        run: |
          @"
          DSH_DESKTOP_APP_ID=com.deepseek.harness
          DSH_DESKTOP_AUTO_UPDATE_ENV=test
          DOWNLOAD_TEST_ORIGIN=https://download.deepseek.com
          DSH_DESKTOP_MANDATORY_UPDATE_TEST_ORIGIN=https://harness-test.deepseek.com
          DSH_DESKTOP_MANDATORY_UPDATE_PROD_ORIGIN=https://harness.deepseek.com
          "@ | Set-Content -Path "apps/desktop/.env.windows" -Encoding utf8

      - name: Package Windows Desktop App (.exe)
        run: pnpm run package:desktop:win:x64:unsigned

      - name: Strip unnecessary files to reduce size
        shell: pwsh
        run: |
          # Find the unpacked app directory
          $unpackedDirs = Get-ChildItem -Path "apps/desktop/.desktop-build" -Recurse -Directory -Filter "win-unpacked" -ErrorAction SilentlyContinue
          foreach ($dir in $unpackedDirs) {
            Write-Host "Processing unpacked dir: $($dir.FullName)"
            
            # 1. Remove unnecessary Electron locales (keep only en-US)
            $localesDir = Join-Path $dir.FullName "locales"
            if (Test-Path $localesDir) {
              Get-ChildItem $localesDir -File | Where-Object { $_.Name -notmatch "^en-US\." } | ForEach-Object {
                Remove-Item $_.FullName -Force
                Write-Host "  Removed locale: $($_.Name)"
              }
            }

            # 2. Remove debug/development files
            Get-ChildItem $dir.FullName -Recurse -Include "*.pdb","*.map","*.d.ts","*.d.mts","*.tsbuildinfo","*.md","LICENSE*","CHANGELOG*","README*","CONTRIBUTING*" -File -ErrorAction SilentlyContinue | ForEach-Object {
              Remove-Item $_.FullName -Force -ErrorAction SilentlyContinue
              Write-Host "  Removed: $($_.Name)"
            }

            # 3. Remove test directories, docs, examples
            Get-ChildItem $dir.FullName -Recurse -Directory -Include "test","tests","__tests__","docs","doc","examples","example",".github","benchmarks","coverage","snapshots" -ErrorAction SilentlyContinue | ForEach-Object {
              Remove-Item $_.FullName -Recurse -Force -ErrorAction SilentlyContinue
              Write-Host "  Removed dir: $($_.Name)"
            }

            # 4. Remove TypeScript source files (keep only compiled JS)
            Get-ChildItem $dir.FullName -Recurse -Include "*.ts","*.tsx" -File -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch "\.d\.ts$" } | ForEach-Object {
              $jsEquivalent = $_.FullName -replace "\.tsx?$", ".js"
              if (Test-Path $jsEquivalent) {
                Remove-Item $_.FullName -Force -ErrorAction SilentlyContinue
                Write-Host "  Removed TS source (JS exists): $($_.Name)"
              }
            }
          }

          # Calculate size reduction
          $exeFile = Get-ChildItem -Path "apps/desktop/.desktop-build" -Recurse -Filter "*deepseek-harness*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exeFile) {
            $sizeMB = [math]::Round($exeFile.Length / 1MB, 2)
            Write-Host "Current .exe size: ${sizeMB} MB"
          }

      - name: Find and compress installer  
        id: find_exe
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "apps/desktop/.desktop-build" -Recurse -Filter "*deepseek-harness*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $installer) {
            $installer = Get-ChildItem -Path apps/desktop -Recurse -Filter "*.exe" | Sort-Object Length -Descending | Select-Object -First 1
          }
          if (-not $installer) {
            Write-Error "No .exe installer found!"
            exit 1
          }
          $sizeMB = [math]::Round($installer.Length / 1MB, 2)
          Write-Host "Installer: $($installer.FullName) (${sizeMB} MB)"

          # Compress with 7-Zip ultra compression (LZMA2)
          $zipPath = "$($installer.DirectoryName)/DeepSeek-Harness-Windows-Compressed.zip"
          Write-Host "Compressing with 7-Zip LZMA2 ultra..."
          & 7z a -tzip -mx=9 -mfb=258 -mpass=15 "$zipPath" "$($installer.FullName)"
          
          $zipSizeMB = [math]::Round((Get-Item $zipPath).Length / 1MB, 2)
          Write-Host "Compressed ZIP size: ${zipSizeMB} MB (saved $([math]::Round($sizeMB - $zipSizeMB, 2)) MB)"

          echo "INSTALLER_PATH=$($installer.FullName)" >> $env:GITHUB_ENV
          echo "ZIP_PATH=$zipPath" >> $env:GITHUB_ENV

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.6-alpha.2' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'DeepSeek Harness v0.1.6-alpha.2 (Windows)' }}
          body: |
            ## DeepSeek Harness Windows Desktop Release 🚀
            
            نسخة تطبيق سطح المكتب لنظام ويندوز مضغوطة بأقصى درجات الضغط.
            
            ### خيارات التحميل (Downloads):
            - **`.exe`** — ملف التثبيت المباشر: حمّله وشغّله مباشرة.
            - **`-Compressed.zip`** — نسخة مضغوطة بحجم أقل: فك الضغط ثم شغّل ملف الـ `.exe`.
          files: |
            ${{ env.INSTALLER_PATH }}
            ${{ env.ZIP_PATH }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
